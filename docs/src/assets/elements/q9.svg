<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" font-family="Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="218" height="218" rx="10" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>

  <!-- element outline -->
