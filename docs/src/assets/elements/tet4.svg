<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 290" font-family="Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="258" height="288" rx="10" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>

  <!-- edges: (1,2) (2,3) (1,3) (1,4) (2,4) (3,4) -->
